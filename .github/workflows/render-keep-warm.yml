name: Keep Render demo warm

on:
  schedule:
    # Render's free web services sleep after 15 minutes without requests.
    - cron: '*/11 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request app health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --fail --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            --header 'Cache-Control: no-cache' \
            --output "$response_file" --write-out '%{http_code}' \
            "https://eluno-assessment.onrender.com/api/health?ping=$(date +%s)")"
          if [[ "$status" != 200 ]] || ! jq -e '.ok == true' "$response_file" >/dev/null; then
            echo "Health check failed (HTTP $status)." >&2
            cat "$response_file" >&2
            exit 1
          fi
          echo 'Render app is responding (HTTP 200).'
